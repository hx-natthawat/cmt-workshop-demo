<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Console — Glow Beauty</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface-2:#fafbfc; --border:#e7e8ec; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --text:#101828; --text-2:#475467; --muted:#98a2b3; --brand:#345589; --brand-2:#4a6ea5; --brand-soft:#eef2f8;
  --good:#12805c; --good-soft:#e6f4ee; --warn-soft:#fef3f2; --warn:#b42318; --track:#eef0f3; --nav:#1f2a3d; --nav-text:#c7d0de; --nav-active:#fff;
}
:root[data-theme=dark]{
  --bg:#0f1115; --surface:#171a1f; --surface-2:#1c2027; --border:#282d35; --shadow:none;
  --text:#f2f4f7; --text-2:#c3c8d0; --muted:#7d8590; --brand:#6b9bd8; --brand-2:#5b8dd6; --brand-soft:#1c2636;
  --good:#3ddc97; --good-soft:#132318; --warn-soft:#2a1614; --warn:#f97066; --track:#22262d; --nav:#111318; --nav-text:#8b93a1; --nav-active:#fff;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){
  --bg:#0f1115;--surface:#171a1f;--surface-2:#1c2027;--border:#282d35;--shadow:none;--text:#f2f4f7;--text-2:#c3c8d0;--muted:#7d8590;
  --brand:#6b9bd8;--brand-2:#5b8dd6;--brand-soft:#1c2636;--good:#3ddc97;--good-soft:#132318;--warn-soft:#2a1614;--warn:#f97066;--track:#22262d;--nav:#111318;--nav-text:#8b93a1;--nav-active:#fff;
}}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* sidebar */
aside{background:var(--nav);color:var(--nav-text);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:8px 10px 18px;font-weight:700;color:#fff;font-size:1.02rem}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#4a6ea5,#345589);display:grid;place-items:center;font-size:1rem}
nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:.9rem;color:var(--nav-text);transition:.12s}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i.active{background:rgba(255,255,255,.12);color:var(--nav-active);font-weight:600}
.nav-i .ic{width:18px;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.75rem;color:var(--muted)}
.side-foot .badge{background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;line-height:1.4}
/* main */
main{padding:0;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,3vw,28px);border-bottom:1px solid var(--border);
  background:var(--surface);position:sticky;top:0;z-index:5}
.topbar h1{font-size:1.12rem;font-weight:700;letter-spacing:-.01em}
.topbar .sub{font-size:.78rem;color:var(--muted)}
.tb-right{display:flex;gap:10px;align-items:center}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:9px;padding:8px 11px;cursor:pointer;font-size:.82rem}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.user{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--text-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:600;font-size:.8rem}
.view{padding:clamp(16px,3vw,28px);max-width:1040px}
/* components */
.grid{display:grid;gap:14px}.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:clamp(14px,2.4vw,20px);box-shadow:var(--shadow)}
.card h2{font-size:.95rem;font-weight:650;margin-bottom:2px}.card .csub{font-size:.76rem;color:var(--muted);margin-bottom:14px}
.kpi .lab{font-size:.76rem;color:var(--text-2)}.kpi .v{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.kpi .v.accent{color:var(--brand)}.kpi .foot{font-size:.72rem;color:var(--muted);margin-top:3px}
.bar-row{display:grid;grid-template-columns:minmax(110px,1.3fr) 3fr 30px;align-items:center;gap:10px;margin:8px 0}
.bar-l{font-size:.8rem;color:var(--text-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{background:var(--track);border-radius:6px;height:13px;overflow:hidden}
.fill{height:100%;background:var(--brand);border-radius:6px;min-width:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}.fill.good{background:var(--good)}
.bar-v{font-size:.8rem;font-weight:600;text-align:right}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;padding:0 12px 9px}
td{padding:11px 12px;border-top:1px solid var(--border);color:var(--text-2);vertical-align:middle}
tr td:first-child{color:var(--text);font-weight:500}
.badge{font-size:.7rem;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.badge.web{background:var(--good-soft);color:var(--good)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-block;font-size:.68rem;background:var(--track);color:var(--text-2);padding:2px 7px;border-radius:6px;margin:1px 3px 1px 0}
.btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:.85rem;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand-2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--border)}.btn.sm{padding:6px 12px;font-size:.78rem}
.btn.danger{background:var(--warn)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:.74rem;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:4px 11px}
.muted{color:var(--muted)}.empty{color:var(--muted);font-size:.85rem;padding:20px;text-align:center}
.promo{border-left:3px solid var(--brand);padding:2px 0 2px 12px;margin:10px 0}.promo b{color:var(--brand)}
.warnbox{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn);border-radius:10px;padding:11px 13px;font-size:.82rem;margin:12px 0}
label.chk{display:flex;gap:9px;align-items:center;font-size:.86rem;margin:10px 0;cursor:pointer}
input[type=text]{padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:.9rem;width:150px}
.spinner{width:26px;height:26px;border:3px solid var(--track);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.5);display:none;place-items:center;z-index:50;padding:16px}
.modal-bg.on{display:grid}
.modal{background:var(--surface);border-radius:16px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.modal h3{font-size:1.05rem;margin-bottom:8px}.modal p{font-size:.86rem;color:var(--text-2);margin-bottom:6px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:.85rem;font-weight:500;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.25s}
.toast.show{opacity:1;transform:none}.toast.ok{background:var(--good);color:#fff}.toast.err{background:var(--warn);color:#fff}
/* responsive */
@media(max-width:820px){.app{grid-template-columns:1fr}
  aside{position:fixed;left:-240px;z-index:40;transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.3)}aside.open{left:0}
  .hamb{display:inline-flex!important}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}.scrim.on{display:block}}
.hamb{display:none}
</style></head>
<body>
<div class="scrim" id="scrim" onclick="toggleNav(false)"></div>
<div class="app">
  <aside id="side">
    <div class="brand"><span class="logo">🧴</span> Glow Console</div>
    <nav id="nav"></nav>
    <div class="side-foot"><div class="badge">🔒 localhost only<br>ทีมการตลาด · governance เปิด</div></div>
  </aside>
  <main>
    <div class="topbar">
      <div style="display:flex;gap:12px;align-items:center">
        <button class="icon-btn hamb" onclick="toggleNav(true)">☰</button>
        <div><h1 id="pt">ภาพรวม</h1><div class="sub" id="ps">Marketing Console · Glow Beauty</div></div>
      </div>
      <div class="tb-right">
        <button class="icon-btn" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">🌗</button>
        <div class="user"><span class="avatar">ก</span><span>ทีมการตลาด</span></div>
      </div>
    </div>
    <div class="view" id="view"><div class="spinner"></div></div>
  </main>
</div>
<div class="modal-bg" id="modalbg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<script>
const NAV=[
 {id:'overview',ic:'📊',t:'ภาพรวม',s:'Marketing Console · Glow Beauty'},
 {id:'broadcast',ic:'📣',t:'Broadcast',s:'ส่งโปรถึงผู้ติดตามทุกคน'},
 {id:'segments',ic:'🎯',t:'Segments',s:'ยิงตาม RFM segment (targeting)'},
 {id:'restock',ic:'🔔',t:'Restock',s:'แจ้งลูกค้าเมื่อของกลับมา'},
 {id:'analytics',ic:'📈',t:'Analytics',s:'Voice of Customer · data loop'},
];
const $=s=>document.querySelector(s); const view=$('#view');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>Number(n||0).toLocaleString('th-TH');
function toggleNav(o){$('#side').classList.toggle('open',o);$('#scrim').classList.toggle('on',o);}
function toast(msg,cls=''){const t=document.createElement('div');t.className='toast '+cls;t.textContent=msg;$('#toast').appendChild(t);
 requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},3200);}
async function api(path,opts){const r=await fetch(path,opts);return r.json();}
function bars(items,cls=''){const max=Math.max(1,...items.map(i=>i[1]));return items.map(([l,n])=>
 `<div class="bar-row"><div class="bar-l" title="${esc(l)}">${esc(l)}</div><div class="track"><div class="fill ${cls}" style="width:${n/max*100}%" title="${esc(l)}: ${n}"></div></div><div class="bar-v">${num(n)}</div></div>`).join('');}

// governance modal → resolve(true/false)
function confirmSend(title,body){return new Promise(res=>{
 $('#modal').innerHTML=`<h3>${title}</h3><p>${body}</p><div class="warnbox">⚠️ การส่งนี้กลับไม่ได้ + กินโควตา — ผู้รับจะได้รับข้อความจริง</div>
  <label class="chk"><input type="checkbox" id="mack"> ฉันเข้าใจและต้องการส่งจริง</label>
  <label class="chk">พิมพ์ <b>SEND</b>: <input type="text" id="mconf" placeholder="SEND"></label>
  <div class="actions"><button class="btn ghost" id="mcancel">ยกเลิก</button><button class="btn danger" id="mok" disabled>ยืนยันส่ง</button></div>`;
 $('#modalbg').classList.add('on');
 const chk=()=>{$('#mok').disabled=!($('#mack').checked && $('#mconf').value.trim()==='SEND');};
 $('#mack').onchange=chk;$('#mconf').oninput=chk;
 const close=v=>{$('#modalbg').classList.remove('on');res(v);};
 $('#mcancel').onclick=()=>close(false);$('#mok').onclick=()=>close(true);
});}

const views={
 async overview(){const d=await api('/api/overview');
  return `<div class="grid g-kpi">
    <div class="card kpi"><div class="lab">บทสนทนาทั้งหมด</div><div class="v">${num(d.conversations)}</div><div class="foot">${Object.entries(d.byChannel||{}).map(([k,v])=>k+' '+v).join(' · ')||'—'}</div></div>
    <div class="card kpi"><div class="lab">ลูกค้าในฐานข้อมูล</div><div class="v">${num(d.customerCount)}</div><div class="foot">${d.segmentCount} RFM segments</div></div>
    <div class="card kpi"><div class="lab">อัตราแปลง สนใจ→ซื้อ</div><div class="v accent">${d.convRate}%</div><div class="foot">จาก funnel การซื้อ</div></div>
    <div class="card kpi"><div class="lab">โควตาข้อความเดือนนี้</div><div class="v">${d.quota.used??'—'}${d.quota.limit?'<span style="font-size:.9rem;color:var(--muted)"> / '+d.quota.limit+'</span>':''}</div><div class="foot">${d.restockPending} คนรอ restock</div></div>
   </div>
   <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">
    <div class="card"><h2>🔧 Tool ที่ AI เรียกบ่อย</h2><div class="csub">จากบทสนทนาทั้งหมด</div>${d.topTools.length?bars(d.topTools):'<div class="empty">ยังไม่มีข้อมูล</div>'}</div>
    <div class="card"><h2>🛒 Funnel การซื้อ</h2><div class="csub">สนใจ → ร่าง → ยืนยัน</div>${bars(d.funnel.map(f=>[f.label,f.n]),'good')}</div>
   </div>`;},

 async broadcast(){const d=await api('/api/promotions');
  return `<div class="card"><h2>📣 Broadcast โปรโมชัน</h2><div class="csub">ส่งถึงผู้ติดตาม LINE ทุกคน (รูปแบบ A: แบรนด์เป็นฝ่ายเริ่ม)</div>
    <div class="pill" style="margin-bottom:12px">โควตาเดือนนี้: ${d.quota.used??'—'}${d.quota.limit?' / '+d.quota.limit:''}</div>
    <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px">${esc(d.intro)}
     ${d.promos.map(p=>`<div class="promo"><b>${esc(p.name)}</b><br>${esc(p.detail)}</div>`).join('')}</div>
    <div style="margin-top:16px"><button class="btn danger" id="bcast">📣 ส่ง Broadcast ถึงทุกคน</button></div>
   </div>`;},

 async segments(){const d=await api('/api/segments');
  return `<div class="card"><h2>🎯 RFM Segments</h2><div class="csub">แบ่งลูกค้า ${num(d.total)} ราย จาก customer_data.csv · ยิงข้อความตรงกลุ่ม</div>
    <table><thead><tr><th>Segment</th><th>ลูกค้า</th><th>flag LINE</th><th>ยอดเฉลี่ย</th><th>ข้อความ</th></tr></thead><tbody>
    ${d.list.map(s=>`<tr><td>${esc(s.name)}</td><td>${num(s.count)}</td><td><span class="badge">${s.lineFlag}</span></td><td>${num(s.avgSpend)} ฿</td><td class="muted" style="max-width:220px">${esc(s.msg)}</td></tr>`).join('')}
    </tbody></table>
    <div class="warnbox">ℹ️ ตัวเลข "flag LINE" มาจากคอลัมน์ตัวอย่างใน CSV — ยังไม่ได้เช็ค LINE จริง · ส่งจริงต้อง map customer_id ↔ LINE userId ผ่าน CDP ก่อน (planning view)</div>
   </div>`;},

 async restock(){const d=await api('/api/restock');
  return `<div class="card"><h2>🔔 Restock Notification</h2><div class="csub">แจ้งลูกค้าที่เคยถามถึงสินค้าตอนของหมด เมื่อของกลับมา (proactive)</div>
    <table><thead><tr><th>สินค้า</th><th>สต็อก</th><th>คนสนใจ</th><th></th></tr></thead><tbody>
    ${d.items.map(x=>`<tr><td>${esc(x.name)} <span class="muted">(${x.sku})</span></td>
      <td>${x.stock===0?'<span class="badge warn">หมด</span>':x.stock+' ชิ้น'}</td>
      <td>${x.interested} คน</td>
      <td>${x.stock>0&&x.interested>0?`<button class="btn sm" onclick="notifyRestock('${x.sku}','${esc(x.name)}',${x.interested})">แจ้งเตือน</button>`:'<span class="muted">—</span>'}</td></tr>`).join('')||'<tr><td colspan=4 class="empty">ยังไม่มีสินค้าที่มีคนสนใจ</td></tr>'}
    </tbody></table>
    <div class="warnbox" style="background:var(--brand-soft);color:var(--text-2);border-color:var(--border)">แจ้งได้เมื่อ: สินค้ากลับมามีสต็อก (>0) และมีลูกค้าสนใจ · ลองให้ลูกค้าถาม "โฟมมีไหม" ใน LINE เพื่อสร้าง interest</div>
   </div>`;},

 async analytics(){const d=await api('/api/voc');
  return `<div class="grid g-kpi">
    <div class="card kpi"><div class="lab">บทสนทนา</div><div class="v">${num(d.total)}</div></div>
    <div class="card kpi"><div class="lab">ผู้ใช้ unique</div><div class="v">${num(d.users)}</div></div>
    <div class="card kpi"><div class="lab">อัตราแปลง</div><div class="v accent">${d.convRate}%</div></div>
   </div>
   <div class="card" style="margin-top:14px"><h2>🔧 Tool usage</h2><div class="csub">มากไปน้อย</div>${d.topTools.length?bars(d.topTools):'<div class="empty">ยังไม่มีข้อมูล</div>'}</div>
   <div class="card"><h2>🛒 Funnel</h2>${bars(d.funnel.map(f=>[f.label,f.n]),'good')}</div>
   <div class="card"><h2>💬 คำถามล่าสุด</h2><div class="csub">${d.recent.length} รายการ</div>
    <div style="overflow-x:auto"><table style="min-width:420px"><thead><tr><th>ข้อความ</th><th>ช่องทาง</th><th>tools</th></tr></thead><tbody>
    ${d.recent.map(r=>`<tr><td>${esc(r.text)}</td><td><span class="badge ${r.channel==='web'?'web':''}">${esc(r.channel)}</span></td><td>${(r.tools||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')||'<span class="muted">—</span>'}</td></tr>`).join('')||'<tr><td colspan=3 class="empty">ยังไม่มีข้อมูล</td></tr>'}
    </tbody></table></div></div>
   <p class="muted" style="font-size:.75rem;margin-top:10px">⚠️ PDPA: userId hash · การเก็บ log ต้องแจ้งในนโยบายความเป็นส่วนตัว</p>`;},
};

async function notifyRestock(sku,name,count){
 if(!await confirmSend('แจ้ง Restock: '+name,`จะ push แจ้งลูกค้า ${count} คนที่สนใจสินค้านี้`))return;
 const d=await api('/api/restock-notify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sku,confirm:'SEND'})});
 toast(d.ok?('✅ '+d.message):('❌ '+d.error),d.ok?'ok':'err');
}

let current='overview';
async function go(id){
 current=id;const n=NAV.find(x=>x.id===id);$('#pt').textContent=n.t;$('#ps').textContent=n.s;
 document.querySelectorAll('.nav-i').forEach(e=>e.classList.toggle('active',e.dataset.id===id));
 toggleNav(false);view.innerHTML='<div class="spinner"></div>';
 try{view.innerHTML=await views[id]();}catch(e){view.innerHTML='<div class="card"><div class="empty">❌ โหลดไม่ได้: '+esc(e.message)+' (server ยังรันอยู่ไหม?)</div></div>';}
 if(id==='broadcast'){$('#bcast').onclick=async()=>{
   if(!await confirmSend('ยืนยัน Broadcast','จะส่งโปรโมชันถึงผู้ติดตาม LINE ทุกคน'))return;
   const d=await api('/api/broadcast',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({confirm:'SEND'})});
   toast(d.ok?('✅ '+d.message):('❌ '+d.error),d.ok?'ok':'err');};}
}
$('#nav').innerHTML=NAV.map(n=>`<div class="nav-i" data-id="${n.id}" onclick="go('${n.id}')"><span class="ic">${n.ic}</span>${n.t}</div>`).join('');
go('overview');
</script></body></html>
